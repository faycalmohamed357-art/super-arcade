name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libltdl-dev python3-setuptools android-sdk
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # Configuration stricte de buildozer.spec
        sed -i 's/^#\?\s*android.accept_sdk_license\s*=.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^#\?\s*android.api\s*=.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\?\s*android.ndk\s*=.*/android.ndk = 25b/' buildozer.spec
        
        # Acceptation automatique des licences Android SDK
        yes | sdkmanager --licenses || true
        
        buildozer -v android debug
      env:
        NONINTERACTIVE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
